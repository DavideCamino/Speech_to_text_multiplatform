name: Windows installer (Vulkan)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_TARGET_DIR: C:/s2t-target
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_GENERATOR: Ninja
      CC: gcc
      CXX: g++
      # Avoid generating a binary optimized only for the hosted runner's CPU.
      GGML_NATIVE: 'OFF'
      GGML_SSE42: 'OFF'
      GGML_AVX: 'OFF'
      GGML_AVX2: 'OFF'
      GGML_BMI2: 'OFF'
      GGML_FMA: 'OFF'
      GGML_F16C: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Install coherent UCRT64 build and runtime dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
      - name: Check packaging logic
        run: python -m unittest discover -s build-aux/windows -p 'test_*.py' -v
      - name: Build and test CPU + Vulkan application
        run: |
          set -euo pipefail
          export LIBCLANG_PATH="$(cygpath -m "$MINGW_PREFIX/bin")"
          # The MSYS2 prefix supplies headers, import libraries and glslc;
          # a separate LunarG Vulkan SDK is not needed on the CI runner.
          export VULKAN_SDK="$(cygpath -m "$MINGW_PREFIX")"
          mkdir -p target
          pacman -Q > target/windows-msys2-packages.txt
          rustc -vV > target/windows-build-info.txt
          glslc --version >> target/windows-build-info.txt
          # Registry sources are used for license collection, not to replace
          # the patched dependency already committed under vendor/.
          cargo vendor --locked --versioned-dirs target/windows-vendor > target/windows-vendor-config.toml
          cargo build --release --locked --features vulkan --bin speech2text
          cargo test --release --locked --features vulkan --lib --tests -- --skip ui::tests::settings_pages_and_menu_surfaces_build
      - name: Assemble portable runtime, sources and notices
        run: |
          python build-aux/windows/package.py --prefix "$(cygpath -m "$MINGW_PREFIX")" --binary "$CARGO_TARGET_DIR/release/speech2text.exe"
      - name: Launch relocated ZIP without build tools in PATH
        shell: pwsh
        run: ./build-aux/windows/smoke-test.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create installer and checksums
        shell: msys2 {0}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match Cargo.toml version: v$VERSION" >&2
            exit 1
          fi
          MSYS2_ARG_CONV_EXCL='*' '/c/Program Files (x86)/Inno Setup 6/ISCC.exe' "/DAppVersion=$VERSION" build-aux/windows/installer.iss
          (cd dist && sha256sum *-setup.exe > Speech2Text-installer.sha256)
      - name: Test silent install, installed window startup and uninstall
        shell: pwsh
        run: ./build-aux/windows/test-installer.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Speech2Text-windows-x86_64-Vulkan
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Speech2Text-windows-diagnostics
          path: |
            dist/windows-smoke/
            dist/windows-installer-smoke/
            target/windows-build-info.txt
            target/windows-msys2-packages.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Speech2Text-windows-x86_64-Vulkan
          path: packages
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            packages/*-setup.exe
            packages/*.zip
            packages/*.sha256
