name: Rust checks
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libgtk-4-dev libadwaita-1-dev libasound2-dev libvulkan-dev glslc
      - name: Build release with Vulkan
        run: cargo build --release --locked --features vulkan
