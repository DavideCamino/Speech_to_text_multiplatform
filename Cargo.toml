[package]
name = "speech2text"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Local speech transcription for the GNOME desktop"
license = "MIT"

[features]
default = []
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]
rocm = ["whisper-rs/hipblas"]

[dependencies]
anyhow = "1"
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
whisper-rs = { version = "0.16", features = ["raw-api"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
